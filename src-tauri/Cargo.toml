[package]
name = "remotecontrol-desktop"
version = "2.0.0"
description = "Fast and stable remote desktop control application"
authors = ["Codext"]
edition = "2021"

[lib]
name = "remotecontrol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2"

# Screen capture
xcap = "0.0.14"

# Input simulation
enigo = { version = "0.2", features = ["serde"] }

# Clipboard
arboard = "3"

# Tauri plugins
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.15"
machine-uid = "0.5"
parking_lot = "0.12"
once_cell = "1"
thiserror = "1"
tracing = "0.1"
md5 = "0.7"
rand = "0.8"
hostname = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation"
]}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
